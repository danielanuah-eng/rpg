<figure data-category="mistica"><a href="imagens/084-pacto-das-cascas-vazias-v1.png"><img loading="lazy" src="imagens/084-pacto-das-cascas-vazias-v1.png" alt="Pacto das Cascas Vazias"></a><figcaption>084 · Pacto das Cascas Vazias<small>mistica</small><p>Mística como fenômeno persistente ao redor de ovos e pessoas.</p></figcaption></figure>
<figure data-category="mistica"><a href="imagens/085-silencio-sobre-o-viveiro-v1.png"><img loading="lazy" src="imagens/085-silencio-sobre-o-viveiro-v1.png" alt="Silêncio sobre o Viveiro"></a><figcaption>085 · Silêncio sobre o Viveiro<small>mistica</small><p>Véu de silêncio com oposição cautelosa aos dragões.</p></figcaption></figure>
<figure data-category="mistica"><a href="imagens/086-sombra-que-guarda-o-ovo-v1.png"><img loading="lazy" src="imagens/086-sombra-que-guarda-o-ovo-v1.png" alt="Sombra que Guarda o Ovo"></a><figcaption>086 · Sombra que Guarda o Ovo<small>mistica</small><p>Alvorum, luz e sombra distribuídas numa incubação.</p></figcaption></figure>
<figure data-category="mistica"><a href="imagens/087-estacao-que-nao-termina-v1.png"><img loading="lazy" src="imagens/087-estacao-que-nao-termina-v1.png" alt="Estação que Não Termina"></a><figcaption>087 · Estação que Não Termina<small>mistica</small><p>Eternyr e natureza numa borda de jardim.</p></figcaption></figure>
<figure data-category="mistica"><a href="imagens/088-vigilia-das-escamas-mortas-v1.png"><img loading="lazy" src="imagens/088-vigilia-das-escamas-mortas-v1.png" alt="Vigília das Escamas Mortas"></a><figcaption>088 · Vigília das Escamas Mortas<small>mistica</small><p>Morbidyum, memória sem gore num lugar de perda.</p></figcaption></figure>
<figure data-category="mistica"><a href="imagens/089-fronteira-de-escamas-v1.png"><img loading="lazy" src="imagens/089-fronteira-de-escamas-v1.png" alt="Fronteira de Escamas"></a><figcaption>089 · Fronteira de Escamas<small>mistica</small><p>Dominum, restrição num limite territorial sem ferimento.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/090-iria-forjadora-de-mares-v1.png"><img loading="lazy" src="imagens/090-iria-forjadora-de-mares-v1.png" alt="Iria, Forjadora de Marés"></a><figcaption>090 · Iria, Forjadora de Marés<small>personagem · conflituo + sublimeyn</small><p>Mulher humana robusta de pele oliva, cabelo preto raspado de um lado, avental curto de cerâmica e calças ferrugem. Numa forja fria aberta ao cais, molda uma lâmina de metal líquido prateado com um martelo arcano ferrugem; vista rente à bigorna, forte escorço da mão. Ajuda reparar defesas contra monstros, escama oferecida por um dragão numa prateleira. Tarde de chuva.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/091-serena-voz-das-barricadas-v1.png"><img loading="lazy" src="imagens/091-serena-voz-das-barricadas-v1.png" alt="Serena, Voz das Barricadas"></a><figcaption>091 · Serena, Voz das Barricadas<small>personagem · conflituo + persona</small><p>Mulher negra alta, tranças curtas, casaco coral poeira e peças de armadura ferrugem, jovem adulta. No meio de uma rua estreita organiza moradores que erguem uma barricada CONTRA a entrada de dragões; um dragão distante aguarda em vez de atacar. Vista oblíqua da janela superior, Serena olha para cima, uma mão ergue estandarte sem emblema e a outra ampara um menino assustado. Manhã nublada. Motivo visível proteção civil, sem vilania.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/092-darian-vigia-do-eclipse-v1.png"><img loading="lazy" src="imagens/092-darian-vigia-do-eclipse-v1.png" alt="Darian, Vigia do Eclipse"></a><figcaption>092 · Darian, Vigia do Eclipse<small>personagem · conflituo + alvorum</small><p>Homem humano idoso de pele castanha, cabelo branco curto, corpulento, armadura de couro carvão e ombreira bronze. Guarda a passagem de dragões no alto de um muro, segura lança de energia ferrugem fraca e lamparina bronze que projeta uma sombra protetora no caminho. Perfil completo andando entre ameias, visto de trás do portão. Tarde encoberta, tensão defensiva sem ataque. Trajes autorais sem uniforme militar moderno.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/093-maira-guardia-dos-ausentes-v1.png"><img loading="lazy" src="imagens/093-maira-guardia-dos-ausentes-v1.png" alt="Maira, Guardiã dos Ausentes"></a><figcaption>093 · Maira, Guardiã dos Ausentes<small>personagem · conflituo + morbidyum</small><p>Mulher humana de meia idade pele clara sardenta, cabelo castanho num coque, postura rígida, capa verde pálido e armadura ferrugem. Agacha diante de memorial de escamas em jardim devastado, uma mão repousa em espada embainhada e a outra sente um espírito verde discreto sobre pedra vazia. Close lateral íntimo, manhã neblinosa, luto pela invasão, sem mortos visíveis. Não inimiga dos dragões por padrão, motivação ambivalente.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/094-orven-estrategista-das-asas-v1.png"><img loading="lazy" src="imagens/094-orven-estrategista-das-asas-v1.png" alt="Orven, Estrategista das Asas"></a><figcaption>094 · Orven, Estrategista das Asas<small>personagem · conflituo + cognitium</small><p>Homem humano esguio pele parda, cabeça calva, bigode fino e pequena barba, traje ferrugem e índigo. Num posto de comando de madeira, planeja zonas onde dragões não devem entrar: move miniaturas de asas e barricadas sobre um mapa sem texto, projetando pequenos planos mentais índigo. Câmera por cima de seu ombro e mãos, janela mostra torre de vigília. Tarde cinza. Defesa racional, sem revelar destino de Valiant.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/095-hestia-duelista-do-instante-v1.png"><img loading="lazy" src="imagens/095-hestia-duelista-do-instante-v1.png" alt="Hestia, Duelista do Instante"></a><figcaption>095 · Hestia, Duelista do Instante<small>personagem · conflituo + eternyr</small><p>Mulher humana atlética de pele escura, cabelo branco em trança curta, vestimenta azul-noite com ferrugem contido. Salta lateralmente sobre UMA pedra suspensa no desabamento de um corredor escolar, espada curta em mão, marcas brancas discretas indicam instante preservado ao redor do pé. Vista baixa frontal em escorço, resgata uma aluna ao fundo, noite com luz de janela fria. Movimento claro sem duplicar corpo.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/096-teren-carcereiro-de-mercurio-v1.png"><img loading="lazy" src="imagens/096-teren-carcereiro-de-mercurio-v1.png" alt="Teren, Carcereiro de Mercúrio"></a><figcaption>096 · Teren, Carcereiro de Mercúrio<small>personagem · sublimeyn + dominum</small><p>Homem humano grande de pele morena, cabelos crespos curtos, barba e óculos pequenos quadrados; túnica cinza prata e luvas vinho apagado. No fosso de contenção, verifica uma grade feita de metal líquido que endurece em torno de um vão vazio, fios de corrente púrpura discreta. Dragão real espera do lado exterior ao longe sem ferimento. Perspectiva baixa através de barras próximas, meio-dia encoberto. Propõe segurança cautelosa.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/097-nalia-alquimista-do-luto-v1.png"><img loading="lazy" src="imagens/097-nalia-alquimista-do-luto-v1.png" alt="Nália, Alquimista do Luto"></a><figcaption>097 · Nália, Alquimista do Luto<small>personagem · sublimeyn + morbidyum</small><p>Mulher humana idosa negra de cabelo cinza crespo e lenço verde suave, corpo baixo gordo, veste avental prata. Em enfermaria com vasos de vidro, prepara vapor prateado em que se desenha uma asa espiritual verde pálida; segura bacia junto à janela, uma família cansada aguarda ao fundo. Vista lateral por entre cortinas, tarde chuvosa. Cuidado em vez de morte; nenhum cadáver nem crânio.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/098-caldris-pesquisador-das-cascas-v1.png"><img loading="lazy" src="imagens/098-caldris-pesquisador-das-cascas-v1.png" alt="Caldris, Pesquisador das Cascas"></a><figcaption>098 · Caldris, Pesquisador das Cascas<small>personagem · sublimeyn + cognitium</small><p>Homem humano jovem pele clara com vitiligo, cabelo cacheado ruivo curto, túnica índigo e avental prata; corpo magro sem aparência de Valiant. Analisa fragmento de casca sobre um pequeno prato com duas lentes e vapor; segura porta entreaberta para impedir entrada de um filhote curioso no laboratório. Câmera vista de dentro de armário de vidraria, luz de tarde. Oposição acadêmica por receio, sem tortura nem final canônico.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/099-elda-restauradora-de-instantes-v1.png"><img loading="lazy" src="imagens/099-elda-restauradora-de-instantes-v1.png" alt="Elda, Restauradora de Instantes"></a><figcaption>099 · Elda, Restauradora de Instantes<small>personagem · sublimeyn + eternyr</small><p>Mulher humana madura pele oliva, cabelo negro liso bem curto, vestes azul-noite com mangas cinza-prata. Num ateliê de cerâmica restaura um ovo rachado VAZIO: fragmentos se alinham em vapor prateado com finas linhas brancas temporais. Vista bem de cima da mesa e seus braços, postura sentada, amanhecer difuso. Estudo cuidadoso, não ressuscitação de personagem.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/100-vesna-tecela-do-mangue-v1.png"><img loading="lazy" src="imagens/100-vesna-tecela-do-mangue-v1.png" alt="Vesna, Tecelã do Mangue"></a><figcaption>100 · Vesna, Tecelã do Mangue<small>personagem · sublimeyn + primitivum</small><p>Mulher humana muito alta pele castanha, cabelo castanho ondulado preso, capas sálvia com faixa prata. Dentro de um mangue, transforma sedimento em pequenas plataformas sólidas enquanto uma criatura jovem dracônica atravessa; mão levanta vapor prateado, outra segura galho. Vista AO NÍVEL DA ÁGUA sob raízes, corpo lateral completo no segundo plano, tarde úmida. Conexão matéria e natureza, sem ponte monumental.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/101-amara-porta-voz-do-limite-v2.png"><img loading="lazy" src="imagens/101-amara-porta-voz-do-limite-v2.png" alt="Amara, Porta-Voz do Limite"></a><figcaption>101 · Amara, Porta-Voz do Limite<small>personagem · dominum + persona</small><p>Mulher humana baixa de pele parda, cabelo preto grisalho num coque, túnica coral poeira com gola vinho, rosto severo mas cansado. Na entrada do viveiro explica aos pais e estudantes a necessidade de barreiras: mantém uma corrente mágica horizontal entre postes com uma mão e fala com gesto aberto da outra. Visão frontal próxima na altura de uma criança, manhã difusa, dragão curioso atrás. Conflito ético, não tirana.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/102-rudek-guardiao-do-portico-v1.png"><img loading="lazy" src="imagens/102-rudek-guardiao-do-portico-v1.png" alt="Rudek, Guardião do Pórtico"></a><figcaption>102 · Rudek, Guardião do Pórtico<small>personagem · dominum + alvorum</small><p>Homem humano maduro negro, ombros largos, barba grisalha curta, traje preto carvão e faixas de bronze, luvas roxo vinho. Fecha com EL0S MÁGICOS um pórtico destinado a impedir passagem de dragões, alternando sombra e luz bronze sob arco de pedra. Vista lateral do outro lado da grade, nenhuma criatura presa ou ferida. Crepúsculo nublado, gesto físico coerente e chaves simples na cintura.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/103-saira-custodia-das-memorias-v1.png"><img loading="lazy" src="imagens/103-saira-custodia-das-memorias-v1.png" alt="Sáira, Custódia das Memórias"></a><figcaption>103 · Sáira, Custódia das Memórias<small>personagem · dominum + morbidyum</small><p>Mulher humana velha pele clara, cabelo branco curto e assimétrico, sobrancelhas marcantes, roupa verde pálido e vinho apagado. Em arquivo memorial recolhe um vestígio de espírito dracônico verde em uma gaiola de fios mágicos aberta que segura na mesa; mão outra mantém porta aberta ao espírito, sem aprisionar violentamente. Vista próxima de três quartos de cima, tarde sombria de janela, relação de cuidado e limite.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/104-brann-guarda-da-reserva-v1.png"><img loading="lazy" src="imagens/104-brann-guarda-da-reserva-v1.png" alt="Brann, Guarda da Reserva"></a><figcaption>104 · Brann, Guarda da Reserva<small>personagem · dominum + primitivum</small><p>Homem humano de meia idade pele castanha, magro e alto, cabelo comprido preto com fios grisalhos, roupa de campo musgo e vinho. Entre árvores ergue uma cerca mágica de correntes junto à trilha para impedir que CAÇADORES atravessem a área de ninho; um dragão verde protege ovos ao fundo. Visto de trás dos caçadores desarmados, corpo inteiro do guardião, amanhecer em neblina. Proteção por restrição, sem violência.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/105-liora-mediadora-do-crepusculo-v1.png"><img loading="lazy" src="imagens/105-liora-mediadora-do-crepusculo-v1.png" alt="Liora, Mediadora do Crepúsculo"></a><figcaption>105 · Liora, Mediadora do Crepúsculo<small>personagem · persona + alvorum</small><p>Mulher humana adulta pele morena, cabelo preto em tranças longas, traje coral poeira, preto e bronze contido. Num tribunal semicircular fica de pé entre dois grupos adversários, uma mão cria pequeno brilho claro, a outra sombra suave, ambos unidos por fio coral. Vista lateral desde arquibancada, grande estrutura ao fundo, tarde chuvosa. Media coexistência de humanos e dragões; um filhote espera tranquilo perto de um estudante.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/106-iven-professor-de-vinculos-v1.png"><img loading="lazy" src="imagens/106-iven-professor-de-vinculos-v1.png" alt="Iven, Professor de Vínculos"></a><figcaption>106 · Iven, Professor de Vínculos<small>personagem · persona + cognitium</small><p>Homem humano idoso pele clara rosada, cabelo grisalho encaracolado, barba curta, corpo gordo, veste índigo e echarpe coral apagado. Sentado no chão de sala de aula com crianças de aparências variadas, mostra uma pequena lembrança mental de asa dracônica entre as mãos, fios coral leves unem atenção dos alunos. Vista na altura das crianças, fundo com janela e cerâmica, manhã nublada. Ensino caloroso sem telepatia agressiva.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/107-naima-criadora-dos-filhotes-v1.png"><img loading="lazy" src="imagens/107-naima-criadora-dos-filhotes-v1.png" alt="Naíma, Criadora dos Filhotes"></a><figcaption>107 · Naíma, Criadora dos Filhotes<small>personagem · persona + primitivum</small><p>Mulher humana jovem negra com cabelo crespo curto arredondado, corpo forte, vestes verde musgo e lenço coral. Agachada DENTRO de abrigo de ninho amplo, liga com fio emocional coral suave sua mão à cabeça de dois filhotes distintos, um robusto alado e outro comprido aquático. Câmera muito próxima ao chão por trás de ovo aberto, luz da tarde chega lateralmente por lona. Afeição e natureza, anatomia consistente.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/108-odran-vigia-dos-vestigios-v1.png"><img loading="lazy" src="imagens/108-odran-vigia-dos-vestigios-v1.png" alt="Odran, Vigia dos Vestígios"></a><figcaption>108 · Odran, Vigia dos Vestígios<small>personagem · alvorum + morbidyum</small><p>Homem humano idoso pele oliva com olhos fundos, cabelo branco curto, túnica carvão e forro verde pálido, pequeno broche bronze. De pé num memorial subterrâneo de escamas, abre janela estreita e a luz bronze dissolve uma sombra dracônica que fica espírito verde tênue ao redor de uma urna simples vazia. Vista ascendente a partir de degraus, dia cinza exterior. Guardião calmo sem clichê de necromante malvado, sem cadáver.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/109-talia-leitura-do-eclipse-v1.png"><img loading="lazy" src="imagens/109-talia-leitura-do-eclipse-v1.png" alt="Tália, Leitura do Eclipse"></a><figcaption>109 · Tália, Leitura do Eclipse<small>personagem · alvorum + cognitium</small><p>Mulher humana madura pele parda, cabelo negro em tranças muito curtas, rosto largo, vestes índigo e preto bronze. No observatório mede sombra de uma asa distante sobre papel sem texto, pequena esfera mental índigo e lâmpada opaca. Vista no topo da escada olhando diagonalmente para baixo, ela inclinada sobre mesa redonda, noite encoberta. Conhecimento de luz e sombra, nada de constelações legíveis ou futuro de Valiant.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/110-erian-guardiao-do-ocaso-v1.png"><img loading="lazy" src="imagens/110-erian-guardiao-do-ocaso-v1.png" alt="Erian, Guardião do Ocaso"></a><figcaption>110 · Erian, Guardião do Ocaso<small>personagem · alvorum + eternyr</small><p>Homem humano jovem de pele escura, cabeça raspada, rosto arredondado, manto azul-noite com bronze e preto, corpo esguio. Numa oficina de relógios artesanais sem números legíveis detém a sombra de uma asa dracônica sobre um mostrador quebrado; fios brancos de tempo e luz bronze mínima nas mãos. Perfil completo, câmera ao lado de engrenagem grande em primeiro plano, crepúsculo. Poder delicado sem relógios gigantes voadores.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/111-tessa-cronista-das-almas-v1.png"><img loading="lazy" src="imagens/111-tessa-cronista-das-almas-v1.png" alt="Tessa, Cronista das Almas"></a><figcaption>111 · Tessa, Cronista das Almas<small>personagem · morbidyum + eternyr</small><p>Mulher humana bem idosa negra, cabelos brancos trançados num coque alto, veste verde pálido azul-noite. Sentada num jardim de inverno registra vestígio dracônico verde tênue que fica suspenso entre as mãos, riscos temporais brancos em torno de uma pétala. Vista bem próxima por trás de um vaso, rosto perfil, tarde de chuva atrás do vidro. Memória e tempo, sem livro com texto ou mortos conhecidos.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/112-mauro-cuidador-do-ciclo-v1.png"><img loading="lazy" src="imagens/112-mauro-cuidador-do-ciclo-v1.png" alt="Mauro, Cuidador do Ciclo"></a><figcaption>112 · Mauro, Cuidador do Ciclo<small>personagem · morbidyum + primitivum</small><p>Homem humano de meia idade pele clara sardenta, ruivo barbudo, baixo e robusto, vestes musgo e verde pálido. Numa estufa comunitária deixa fragmento de casca dracônica antiga virar nutriente: espírito verde discreto sobe enquanto raízes novas abraçam casca no solo. Visto de cima entre duas fileiras de mudas, joelhos sujos, manhã nublada. Natureza e memória de vida, nenhum gore ou cadáver.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/113-adira-escutadora-de-ninhos-v1.png"><img loading="lazy" src="imagens/113-adira-escutadora-de-ninhos-v1.png" alt="Adira, Escutadora de Ninhos"></a><figcaption>113 · Adira, Escutadora de Ninhos<small>personagem · cognitium + primitivum</small><p>Mulher humana jovem pele oliva, cabelo castanho longo amarrado, olhos atentos, uniforme de campo musgo com echarpe índigo. Deitada de bruços em uma plataforma de madeira observa ovos num ninho abaixo, pequenos diagramas mentais índigo como linhas sem letras pairam junto aos olhos. Visão lateral através de galhos, um dragão adulto ao fundo aceita sua observação. Tarde fria, comportamento natural e conhecimento, pose rara e amistosa.</p></figcaption></figure>
<figure data-category="personagem"><a href="imagens/114-selmo-jardineiro-das-eras-v1.png"><img loading="lazy" src="imagens/114-selmo-jardineiro-das-eras-v1.png" alt="Selmo, Jardineiro das Eras"></a><figcaption>114 · Selmo, Jardineiro das Eras<small>personagem · eternyr + primitivum</small><p>Homem humano muito velho pele morena, rosto enrugado, barba longa branca e cabelo preso, traje verde musgo com azul-noite. Numa varanda baixa cuida de uma muda que mostra etapas de crescimento em UMA espiral de galhos, linhas brancas temporais discretas; dragão pequeno repousa enrolado no vaso ao lado. Vista de perfil à distância por trás de regador, inverno de manhã cinza. Natureza e tempo serenos, sem múltiplos painéis.</p></figcaption></figure></main><script>document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>document.querySelectorAll("figure").forEach(f=>f.hidden=b.dataset.filter!=="all"&&f.dataset.category!==b.dataset.filter));</script></html>
