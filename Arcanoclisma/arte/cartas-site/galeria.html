<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão das artes · Arcanoclisma</title><style>:root{color-scheme:dark}body{margin:0;background:#111f29;color:#eee6d7;font:16px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px}h1,h2{font-family:Georgia,serif;color:#e2cb98}.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px}.carta{padding:18px;background:#192b37;border-radius:14px}.nova{width:100%;height:auto;aspect-ratio:63/88;object-fit:contain;display:block;border-radius:12px}.base{width:150px;height:150px;object-fit:contain;background:#19222b}a{color:#ded0ac}small{color:#b9c7cd}figure{margin:0}summary{cursor:pointer;margin-top:15px}</style></head><body><main><h1>Artes novas para o jogo atual</h1><p id="progresso"></p><p>Cada imagem foi criada como uma cena própria. As referências provisórias continuam preservadas; custos e regras pertencem ao motor do Claude.</p><div class="grade" id="galeria"></div></main><script src="galeria-dados.js"></script><script>const d=window.ARTES_SITE;document.querySelector('#progresso').textContent=d.concluidas+' de '+d.meta+' artes geradas · avaliação final pendente';for(const c of d.cartas){const a=document.createElement('article');a.className='carta';const h=document.createElement('h2');h.textContent=c.nome;const l=document.createElement('a');l.href=c.imagem;const img=document.createElement('img');img.className='nova';img.src=c.imagem;img.alt='Nova cena de '+c.nome;img.loading='lazy';l.append(img);a.append(h,l);if(c.base){const de=document.createElement('details'),su=document.createElement('summary'),ba=document.createElement('img');su.textContent='Referência provisória anterior';ba.className='base';ba.src=c.base;ba.alt='Arte anteriormente usada';de.append(su,ba);a.append(de);}document.querySelector('#galeria').append(a);}</script></body></html>
