<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cataclisma — avisos centrais</title><style>body{background:#1b1f2c;color:#dbe5e6;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:920px}button{background:#292e40;color:inherit;border:1px solid #49536b;border-radius:8px;padding:10px;cursor:pointer}button img{width:120px;height:120px;image-rendering:pixelated;display:block;margin:auto}span{display:block}#stage{height:290px;margin:20px 0;background:#202838;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #465069;border-radius:12px}canvas{width:192px;height:192px;image-rendering:pixelated}label{margin-left:12px}h1{font-size:22px}</style><h1>Avisos do Cataclisma</h1><p>Escolha um evento para ver um ciclo de cor no centro.</p><button id="toggle">Pausar</button><label><input type="checkbox" id="static"> Movimento reduzido</label><div id="stage"><canvas width="96" height="96"></canvas><p id="name"></p></div><main><button data-id="chuva-de-moedas"><img src="chuva-de-moedas/estatico.png" alt="Chuva de moedas"><span>Chuva de moedas</span></button><button data-id="queda-de-pedras"><img src="queda-de-pedras/estatico.png" alt="Queda de pedras"><span>Queda de pedras</span></button><button data-id="terremoto"><img src="terremoto/estatico.png" alt="Terremoto"><span>Terremoto</span></button><button data-id="mare-de-lava"><img src="mare-de-lava/estatico.png" alt="Mare de lava"><span>Mare de lava</span></button><button data-id="portal-caotico"><img src="portal-caotico/estatico.png" alt="Portal caotico"><span>Portal caotico</span></button><button data-id="eco-ancestral"><img src="eco-ancestral/estatico.png" alt="Eco ancestral"><span>Eco ancestral</span></button><button data-id="mare-de-energia"><img src="mare-de-energia/estatico.png" alt="Mare de energia"><span>Mare de energia</span></button><button data-id="festival-de-fogos"><img src="festival-de-fogos/estatico.png" alt="Festival de fogos"><span>Festival de fogos</span></button><button data-id="nevoeiro"><img src="nevoeiro/estatico.png" alt="Nevoeiro"><span>Nevoeiro</span></button><button data-id="vendaval"><img src="vendaval/estatico.png" alt="Vendaval"><span>Vendaval</span></button><button data-id="papa-moedas"><img src="papa-moedas/estatico.png" alt="Papa-moedas"><span>Papa-moedas</span></button><button data-id="errante"><img src="errante/estatico.png" alt="Errante"><span>Errante</span></button></main><script>const data={"chuva-de-moedas": "Chuva de moedas", "queda-de-pedras": "Queda de pedras", "terremoto": "Terremoto", "mare-de-lava": "Mare de lava", "portal-caotico": "Portal caotico", "eco-ancestral": "Eco ancestral", "mare-de-energia": "Mare de energia", "festival-de-fogos": "Festival de fogos", "nevoeiro": "Nevoeiro", "vendaval": "Vendaval", "papa-moedas": "Papa-moedas", "errante": "Errante"};const c=document.querySelector('canvas'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let paused=false,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,selected=Object.keys(data)[0],atlas=new Image(),start=performance.now();document.querySelector('#static').checked=reduced;function pick(id){selected=id;atlas.src=id+'/atlas.png';start=performance.now();document.querySelector('#name').textContent=data[id]}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pick(b.dataset.id));document.querySelector('#static').onchange=e=>reduced=e.target.checked;document.querySelector('#toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar'};let held=0;function paint(t){if(!paused)held=Math.floor((t-start)/160)%12;let f=reduced?0:held;ctx.clearRect(0,0,96,96);if(atlas.complete&&atlas.naturalWidth)ctx.drawImage(atlas,(f%4)*96,Math.floor(f/4)*96,96,96,0,0,96,96);requestAnimationFrame(paint)}pick(selected);requestAnimationFrame(paint);</script></html>
